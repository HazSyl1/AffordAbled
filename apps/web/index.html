<!doctype html>
<html lang="en" data-type="software" data-radius="soft" data-motion="restrained">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta id="app-theme-color" name="theme-color" content="#F0F4F8" />
    <meta name="color-scheme" content="light dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="description" content="A personal AI wallet for clearer everyday and shared money." />
    <meta name="page-type" content="software" />
    <meta name="site-kind" content="software" />
    <title>AffordAbled — Personal AI Wallet</title>
    <script>
      (() => {
        const value = localStorage.getItem('affordabled-theme');
        const mode = value === 'light' || value === 'dark'
          ? value
          : matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = mode;
        document.querySelector('#app-theme-color')?.setAttribute('content', mode === 'dark' ? '#000000' : '#F0F4F8');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
