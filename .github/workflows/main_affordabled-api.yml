name: Build and deploy Python app to Azure Web App - affordabled-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install API dependencies
        working-directory: apps/api
        run: |
          python -m venv antenv
          source antenv/bin/activate
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check agent regression evaluations
        working-directory: apps/api
        run: |
          source antenv/bin/activate
          python -m pytest -q tests/test_deepeval_agent_regressions.py
          python scripts/run_deepeval_guardrail_eval.py

      - name: Stage API package
        run: |
          mkdir -p deploy/api
          cp -R apps/api/. deploy/api/
          rm -f deploy/api/pyproject.toml

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: deploy/api

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download API artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app
          path: deploy/api

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy API to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: affordabled-api
          slot-name: Production
          package: deploy/api
