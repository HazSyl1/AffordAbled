name: Agent regression evaluations

on:
  pull_request:
    paths:
      - "apps/api/**"
      - ".github/workflows/agent-regressions.yml"
  workflow_dispatch:

jobs:
  evaluate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - name: Install API dependencies
        working-directory: apps/api
        run: python -m pip install -r requirements.txt
      - name: Check agent regression evaluations
        working-directory: apps/api
        run: |
          python -m pytest -q tests/test_deepeval_agent_regressions.py
          python scripts/run_deepeval_guardrail_eval.py
